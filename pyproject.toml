[project]
name = "arco-z2n"
version = "0.1.0"
description = "arco implementation of zonal to nodal"
authors = [{ name = "pesap", email = "pesap@users.noreply.github.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "prek>=0.3.5,<0.4.0",
    "pytest>=8.4.2,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.14.0,<0.15.0",
]


[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arco_z2n"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--cov=arco_z2n", "--cov-report=term-missing:skip-covered"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.forge]
blueprint = "python-library"
project_name = "arco-z2n"
package_name = "arco_z2n"
description = "arco implementation of zonal to nodal"
author_name = "pesap"
author_email = "pesap@users.noreply.github.com"
license = "BSD-3-Clause"
python_min = "3.12"

[tool.forge.options]
docs = false
codecov = true
pypi_publish = true
prettier = true
