name: forge-update

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install forge
        run: cargo install --git https://github.com/pesap/forge --locked forge
      - name: Update Forge-managed infrastructure
        run: forge update --path .
      - name: Refresh dependency lockfile
        run: uv lock
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update Forge-managed infrastructure"
          branch: chore/forge-update
          title: "chore: update Forge-managed infrastructure"
          body: |
            This PR was automatically generated by the forge update workflow.

            - Runs `forge update --path .`
            - Runs `uv lock` so generated locked CI stays in sync
            - Updates only Forge-managed infra files and dependency lockfiles
